<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Toolbar-size logo, drawn on whole pixels so it stays sharp. No shadow at this
       size; a light border keeps the white tile visible on a light toolbar. -->
  <rect x="0.5" y="0.5" width="15" height="15" rx="3" fill="#fff" stroke="#c9c9c9" shape-rendering="geometricPrecision" />
  <rect x="5" y="4" width="6" height="1" fill="#000" />
  <rect x="5" y="5" width="1" height="2" fill="#000" />
  <rect x="10" y="5" width="1" height="2" fill="#000" />
  <rect x="3" y="7" width="10" height="6" fill="#000" />
</svg>
